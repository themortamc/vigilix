name: Compilar APK Vigilix con Rust

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

# Permisos mínimos para el token del workflow: solo lectura del repositorio.
permissions:
  contents: read

jobs:
  # Pruebas del núcleo en Rust. Es un job independiente: si fallan, se ve en rojo
  # pero no impide generar el APK.
  rust-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Configurar Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # rama stable

      - name: Pruebas del núcleo
        working-directory: rust
        run: |
          LOCKED=""
          if [ -f Cargo.lock ]; then LOCKED="--locked"; fi
          cargo test --release $LOCKED

  # Tests unitarios Kotlin (Robolectric + JUnit4)
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Configurar Java JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: 25.2.9519653
          build-tools: 34.0.0

      - name: Configurar Gradle 8.5
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          echo "GRADLE_HOME=$PWD/gradle-8.5" >> $GITHUB_ENV
          echo "$PWD/gradle-8.5/bin" >> $GITHUB_PATH
          gradle --version

      - name: Ejecutar tests unitarios
        run: |
          gradle --stop
          rm -rf ~/.gradle/caches
          gradle testDebugUnitTest --stacktrace --info --no-daemon --no-build-cache
        continue-on-error: true

      - name: Volcar log de KAPT si falla
        if: failure()
        run: |
          echo "=== KAPT generateStubs log ==="
          find app/build -name "*.log" -path "*kapt*" 2>/dev/null | head -5 | xargs -r cat
          echo "=== KAPT generateStubs output ==="
          find app/build -path "*kapt*generateStubs*" -name "*.kt" 2>/dev/null | head -20 | xargs -r cat
          echo "=== Gradle daemon logs ==="
          ls -la ~/.gradle/daemon/ 2>/dev/null || true
          echo "=== Gradle daemon logs content ==="
          find ~/.gradle/daemon -name "*.log" 2>/dev/null | head -3 | xargs -r cat
          echo "=== KAPT worker logs ==="
          find ~/.gradle -name "*kapt*" -name "*.log" 2>/dev/null | head -5 | xargs -r cat

  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Descargar código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Configurar Java JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Rust y targets de Android
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # rama stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Instalar cargo-ndk (versión fija)
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: 25.2.9519653
          build-tools: 34.0.0

      - name: Compilar núcleo en Rust (.so)
        working-directory: rust
        run: |
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653
          LOCKED=""
          if [ -f Cargo.lock ]; then
            LOCKED="--locked"
          else
            echo "::warning::Falta rust/Cargo.lock: las dependencias de Rust no quedan fijadas. Generalo con 'cargo generate-lockfile' y subilo al repositorio."
          fi
          cargo ndk -t arm64-v8a -t x86_64 -o ../app/src/main/jniLibs build --release $LOCKED

      - name: Configurar Gradle 8.5
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          echo "GRADLE_HOME=$PWD/gradle-8.5" >> $GITHUB_ENV
          echo "$PWD/gradle-8.5/bin" >> $GITHUB_PATH
          gradle --version

      - name: Compilar APK (debug)
        run: |
          gradle --stop
          rm -rf ~/.gradle/caches
          gradle assembleDebug --stacktrace --info --no-daemon --no-build-cache

      - name: Listar salidas de build para debug
        run: |
          echo "=== Build outputs ==="
          find app/build/outputs -type f -name "*.apk" 2>/dev/null | head -20
          ls -la app/build/outputs/apk/debug/ 2>/dev/null || true

      - name: Volcar log de KAPT si falla
        if: failure()
        run: |
          echo "=== KAPT generateStubs log ==="
          find app/build -name "*.log" -path "*kapt*" 2>/dev/null | head -5 | xargs -r cat
          echo "=== KAPT generateStubs output ==="
          find app/build -path "*kapt*generateStubs*" -name "*.kt" 2>/dev/null | head -20 | xargs -r cat

      - name: Subir APK generado
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Vigilix-Debug-APK
          path: app/build/outputs/apk/debug/*.apk