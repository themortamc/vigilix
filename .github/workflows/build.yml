name: Compilar APK Vigilix con Rust

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

# Permisos mínimos para el token del workflow: solo lectura del repositorio.
permissions:
  contents: read

jobs:
  # Pruebas del núcleo en Rust. Es un job independiente: si fallan, se ve en rojo
  # pero no impide generar el APK.
  rust-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Configurar Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # rama stable

      - name: Pruebas del núcleo
        working-directory: rust
        run: |
          LOCKED=""
          if [ -f Cargo.lock ]; then LOCKED="--locked"; fi
          cargo test --release $LOCKED

  # Tests unitarios Kotlin (Robolectric + JUnit4)
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Configurar Java JDK 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "cmdline-tools;latest"

      - name: Hacer ejecutable gradlew
        run: chmod +x gradlew

      - name: Ejecutar tests unitarios
        run: |
          ./gradlew --stop
          rm -rf ~/.gradle/caches
          ./gradlew testDebugUnitTest --stacktrace --info --no-daemon --no-build-cache

  # Compilar APK (debug) - matrix API 26/28/30/34
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        api: [26, 28, 30, 34]
        include:
          - api: 26
            emulator: "pixel_2_api_26"
            ndk: "25.2.9519653"
          - api: 28
            emulator: "pixel_3_api_28"
            ndk: "25.2.9519653"
          - api: 30
            emulator: "pixel_4_api_30"
            ndk: "25.2.9519653"
          - api: 34
            emulator: "pixel_7_api_34"
            ndk: "25.2.9519653"
    steps:
      - name: Descargar código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Configurar Java JDK 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar Rust y targets de Android
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # rama stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Instalar cargo-ndk (versión fija)
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Aceptar licencias del SDK de Android e instalar NDK y plataforma
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;${{ matrix.ndk }}" "cmdline-tools;latest"

      - name: Compilar núcleo en Rust (.so)
        working-directory: rust
        run: |
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ matrix.ndk }}
          LOCKED=""
          if [ -f Cargo.lock ]; then
            LOCKED="--locked"
          else
            echo "::warning::Falta rust/Cargo.lock: las dependencias de Rust no quedan fijadas. Generalo con 'cargo generate-lockfile' y subilo al repositorio."
          fi
          cargo ndk -t arm64-v8a -t x86_64 -o ../app/src/main/jniLibs build --release $LOCKED

      - name: Hacer ejecutable gradlew
        run: chmod +x gradlew

      - name: Compilar APK (debug) - API ${{ matrix.api }}
        run: |
          ./gradlew --stop
          rm -rf ~/.gradle/caches
          ./gradlew assembleDebug --stacktrace --info --no-daemon --no-build-cache

      - name: Listar salidas de build para debug
        run: |
          echo "=== Build outputs (API ${{ matrix.api }}) ==="
          find app/build/outputs -type f -name "*.apk" 2>/dev/null | head -20
          ls -la app/build/outputs/apk/debug/ 2>/dev/null || true

      - name: Subir APK generado
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Vigilix-Debug-APK-API-${{ matrix.api }}
          path: app/build/outputs/apk/debug/*.apk

  # Lint check
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Configurar Java JDK 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "cmdline-tools;latest"

      - name: Hacer ejecutable gradlew
        run: chmod +x gradlew

      - name: Ejecutar lint
        run: |
          ./gradlew lintDebug --stacktrace --no-daemon --no-build-cache

  # ProGuard check (release build)
  proguard-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Configurar Java JDK 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653" "cmdline-tools;latest"

      - name: Hacer ejecutable gradlew
        run: chmod +x gradlew

      - name: Compilar núcleo en Rust (.so)
        working-directory: rust
        run: |
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653
          LOCKED=""
          if [ -f Cargo.lock ]; then LOCKED="--locked"; fi
          cargo ndk -t arm64-v8a -t x86_64 -o ../app/src/main/jniLibs build --release $LOCKED

      - name: Compilar APK (release)
        run: |
          ./gradlew --stop
          rm -rf ~/.gradle/caches
          ./gradlew assembleRelease --stacktrace --info --no-daemon --no-build-cache
        continue-on-error: true