name: Compilar APK Vigilix con Rust

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Rust y Target Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Instalar cargo-ndk
        run: cargo install cargo-ndk

      - name: Aceptar licencias del SDK de Android e instalar NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;25.2.9519653"

      - name: Compilar Core en Rust (.so)
        run: |
          cd rust
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653
          cargo ndk -t arm64-v8a -o ../app/src/main/jniLibs build --release

      - name: Generar Gradle Wrapper si no existe
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Compilar APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Subir APK generado
        uses: actions/upload-artifact@v4
        with:
          name: Vigilix-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
