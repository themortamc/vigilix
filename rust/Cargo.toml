[package]
name = "vigilix_core"
version = "0.3.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
sha2 = "0.10"
hex = "0.4"
chacha20poly1305 = { version = "0.10", features = ["alloc"] }
argon2 = "0.5"
rand = "0.8"
zeroize = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
overflow-checks = true
